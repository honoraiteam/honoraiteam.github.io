baseURL = 'https://honoraiteam.github.io/'

title = '荣耀AI团队'
theme = 'LoveIt'

languageCode = 'zh-CN'
languageName = "简体中文"
hasCJKLanguage = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Hugo 解析文档的配置
[markup]
  # 语法高亮设置 (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    # false 是必要的设置 (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false

[params]
    images = ["/images/YOYO.png"]
    [params.author]
        name = "HONOR AI"
        email = ""
        link = ""
    [params.header]
        [params.header.title]
            name = "HONOR"

    title = "HONOR"
    description = "HONOR AI Team"
    [params.home]
        [params.home.profile]
            title = "HONOR AI Team"
            avatarURL = "/images/yoyo.png"
            subtitle = ""
            typeit = true
    [params.footer]
        enable = true
        # LoveIt 新增 | 0.2.0 自定义内容 (支持 HTML 格式)
        custom = 'Designed by HONOR'
        # LoveIt 新增 | 0.2.0 是否显示 Hugo 和主题信息
        hugo = false
        # LoveIt 新增 | 0.2.0 是否显示版权信息
        copyright = true
        # LoveIt 新增 | 0.2.0 是否显示作者
        author = false
        # 网站创立年份
        since = 2019
        # ICP 备案信息，仅在中国使用 (支持 HTML 格式)
        icp = ""
        # 许可协议信息 (支持 HTML 格式)
        license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'
    [params.social]
        Weibo = "@"
        Email = "@"
        GitHub = "@"
        TikTok = "@"
        Bilibili = "@"
        Zhihu = "@"
    [params.page]
        [params.page.share]
            enable = false
